version = 2

[[dgx]]
id = "dgx-1"
name = "DGX-1"
url = "http://192.168.1.10:9400/metrics"
# DCGM remains the source for GPU temperature/utilisation and ordinary
# framebuffer MEM. DGX Spark can opt into host UMA memory from node_exporter:
# memory_source = "node-exporter"
# node_exporter_url = "http://192.168.1.10:9100/metrics"
# Mixed two-DGX example: keep this first table as an ordinary DCGM endpoint,
# then add the following Spark table and set fan_endpoint_ids = ["dgx-1", "spark"]:
#
# [[dgx]]
# id = "spark"
# name = "DGX-Spark"
# url = "http://192.168.1.11:9400/metrics"
# memory_source = "node-exporter"
# node_exporter_url = "http://192.168.1.11:9100/metrics"

[dashboard]
# "graph-2" is the compact two-DGX dashboard. Select "graph-1" in Fan
# Control > Setting > UI for the classic view. Graph #2 POWER is N/A unless
# DCGM reported a valid power value for every physical GPU.
graph_view = "graph-2"

# Optional Graph #2 display-only bounds, shared by both DGX columns and the
# web view. Uncomment a whole desired block, including its table header and
# both min/max lines. Omitted metrics keep their defaults. MEM stays percent;
# the upper memory summary stays GiB. Explicit TEMP max = 100 pins the scale
# at 100 C; omitting TEMP instead uses max(100 C, emergency temperature).
# To zoom POWER to 0..120 W, change its max below from 240 to 120.
# [dashboard.ranges.utilization]
# min = 0
# max = 100
#
# [dashboard.ranges.memory]
# min = 0
# max = 100
#
# [dashboard.ranges.temperature]
# min = 0
# max = 100
#
# [dashboard.ranges.power]
# min = 0
# max = 240
# Each enabled table requires finite min < max; percentage bounds stay 0..100.
# Edit config.toml and restart the primary controller and web renderer.

[dashboard.colors]
# Optional foreground colors for MEM, UTIL, TEMP, and POWER charts. Use a Rich
# color name or exact #RRGGBB. Omitted MEM/UTIL/TEMP use the terminal default;
# omitted POWER uses ansi_green. The literal value "default" is not accepted.
memory = "yellow"
utilization = "cyan"
temperature = "red"
# Power defaults to ansi_green when omitted.
power = "ansi_green"

[web]
# The browser companion is opt-in and read-only by default. enabled does not
# start the renderer; run `./scripts/web.sh start` separately. Keep the
# loopback default, or explicitly use 0.0.0.0 for a trusted private LAN.
# Never use the wildcard with router port forwarding or WAN firewall exposure.
enabled = false
# WARNING: allow_control is separate from enabled. true lets every browser
# visitor on this trusted LAN edit settings and turn fans on/off without login.
# Do not expose this service to the WAN.
allow_control = false
host = "127.0.0.1"
port = 8000
# socket_path = "/absolute/path/to/.dgx-fan-monitor.sock"

[collection]
# The next request starts after the previous request finishes plus this interval.
interval_seconds = 2.0
timeout_seconds = 1.5
stale_after_seconds = 6.0
# Extra attempts after the first DCGM request; omitted default is 0, while
# this example deliberately uses 3. Only transport errors and HTTP
# 408, 429, and 5xx responses retry; stale or exhausted telemetry is fail-safe.
retry_count = 3
retry_delay_seconds = 10.0

[control]
# Fan 1 and Fan 2 are explicitly mapped. For one DGX, use the same ID twice.
fan_endpoint_ids = ["dgx-1", "dgx-1"]
# Allowed values: "independent" (default) or "linked".
# independent uses each fan's own mapped-DGX demand (for example 25%, 100% ->
# 25%, 100%). linked applies the higher mapped demand to both (25%, 100% ->
# 100%, 100%), within the normal maximum cap. Normal targets keep hysteresis
# and max-speed behavior; safety is shared in both modes, while startup/tach
# boost is shared only in linked mode. To run both fans together, set
# fan_mode = "linked".
fan_mode = "independent"
enabled_at_startup = true
max_speed_percent = 100
# Optional integer 0..100 (default 100) for missing/stale/failed telemetry,
# emergency temperature, fan stall, and safety recovery; independent of max_speed_percent.
fallback_speed_percent = 100
hysteresis_celsius = 2.0
emergency_temperature_celsius = 75.0
recovery_seconds = 10.0

[[control.stages]]
max_temperature_celsius = 45.0
speed_percent = 20

[[control.stages]]
max_temperature_celsius = 55.0
speed_percent = 50

[[control.stages]]
max_temperature_celsius = 70.0
speed_percent = 80

[[control.stages]]
speed_percent = 100

[hardware]
# Use fake on development machines. raspberry-pi uses Linux PWM and libgpiod lazily at runtime.
backend = "fake"
# Fan 1: BCM18 / physical pin 12 (PWM0); Fan 2: BCM19 / physical pin 35 (PWM1).
pwm_gpio_bcm = [18, 19]
pwm_frequency_hz = 25000
# Direct Noctua NF-A6x25 5V PWM wiring is non-inverted.
pwm_inverted = false
tach_gpio_bcm = [23, 24]
pulses_per_revolution = [2, 2]
startup_boost_seconds = 1.0
stall_timeout_seconds = 5.0
# Default "full" is fail-safe. Set "off" only when this exact fan is known
# to stop at 0% PWM and only for a clean TUI exit (not boot, SIGKILL, or power loss).
shutdown_mode = "off"
