[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgx-fan"
version = "0.1.0"
description = "DCGM-driven Raspberry Pi fan controller TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "prometheus-client>=0.20", "textual>=0.70"]

[project.optional-dependencies]
raspberry-pi = ["gpiod>=2.0.2,<3"]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
dgx-fan = "dgx_fan.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dgx_fan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
